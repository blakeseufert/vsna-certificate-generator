name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate site
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html = Path("index.html").read_text()
          HTMLParser().feed(html)
          assert Path("vsna-logo.png").stat().st_size > 0
          assert 'get("creator") === "true"' in html
          assert '++creatorClicks === 5' in html
          assert 'role="switch"' in html and '$("logo").disabled' in html
          assert '<textarea id="event"' in html and 'white-space: pre-line' in html
          assert 'Name of current VSNA President' in html and '$("date").value = `' in html
          assert 'white-space: nowrap' in html and 'const fitSignature = () =>' in html
          assert 'min-width: 297mm' in html and 'const fitCertificate = () =>' not in html
          PY
          awk '/<script>/{inside=1; next} /<\/script>/{inside=0} inside' index.html | node --check
      - run: mkdir _site && cp index.html vsna-logo.png _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
